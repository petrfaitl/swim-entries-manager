<style>
  .folder-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    border: 1.5px solid #e0e3ed;
    border-radius: 7px;
    background: #fafbfd;
  }

  .folder-info {
    min-width: 0;
    flex: 1;
  }

  .folder-name {
    font-size: 12.5px;
    font-weight: 600;
    color: #1a1a2e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .folder-source {
    font-size: 10.5px;
    color: #7b8299;
  }

  .folder-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-folder {
    width: auto;
    padding: 5px 10px;
    margin: 0;
    font-size: 11.5px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid #d0d5e2;
    background: #ffffff;
    color: #1a1a2e;
    cursor: pointer;
    box-shadow: none;
    transition: background 0.15s, border-color 0.15s;
  }

  .btn-folder:hover:not(:disabled) {
    background: #f0f3fa;
    border-color: #0397B3;
    transform: none;
    box-shadow: none;
  }

  .btn-folder:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .btn-folder-reset {
    color: #7b8299;
  }

  .picker-hint {
    margin-top: 5px;
    font-size: 10.5px;
    color: #7b8299;
    line-height: 1.35;
    display: none;
  }

  .picker-error {
    margin-top: 4px;
    font-size: 11px;
    color: #c62828;
    display: none;
  }
</style>

<div class="field" id="exportFolderField">
  <label>Destination Folder</label>
  <div class="folder-bar">
    <div class="folder-info">
      <div class="folder-name" id="exportFolderName">Loading...</div>
      <div class="folder-source" id="exportFolderSource"></div>
    </div>
    <div class="folder-actions">
      <button type="button" class="btn-folder" id="chooseFolderBtn">Choose Folder...</button>
      <button type="button" class="btn-folder btn-folder-reset" id="resetFolderBtn" style="display: none;">Reset</button>
    </div>
  </div>
  <div class="picker-hint" id="pickerUnconfiguredHint">
    Folder picker unavailable (<code>GOOGLE_PICKER_API_KEY</code> not configured in Script Properties). Exports will save to the spreadsheet folder or My Drive root.
  </div>
  <div class="picker-error" id="pickerError"></div>
</div>

<script>
  (function() {
    const folderNameEl = document.getElementById('exportFolderName');
    const folderSourceEl = document.getElementById('exportFolderSource');
    const chooseBtn = document.getElementById('chooseFolderBtn');
    const resetBtn = document.getElementById('resetFolderBtn');
    const hintEl = document.getElementById('pickerUnconfiguredHint');
    const errorEl = document.getElementById('pickerError');

    let pickerApiLoaded = false;
    let pickerScriptLoading = false;
    let currentPickerConfigured = true;

    function showPickerError(msg) {
      if (!msg) {
        errorEl.textContent = '';
        errorEl.style.display = 'none';
      } else {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      }
    }

    function sourceLabel(source) {
      if (source === 'picker') return 'Selected via Google Picker';
      if (source === 'auto') return 'Spreadsheet folder (automatic)';
      return 'My Drive root (fallback)';
    }

    window.updateExportFolderUI = function(folderStatus) {
      if (!folderStatus) return;
      folderNameEl.textContent = folderStatus.folderName || 'My Drive (root)';
      folderSourceEl.textContent = sourceLabel(folderStatus.source);
      resetBtn.style.display = (folderStatus.source === 'picker') ? 'inline-block' : 'none';

      if (typeof folderStatus.pickerConfigured === 'boolean') {
        currentPickerConfigured = folderStatus.pickerConfigured;
      }

      if (!currentPickerConfigured) {
        chooseBtn.disabled = true;
        chooseBtn.title = 'Configure GOOGLE_PICKER_API_KEY in Script Properties to enable';
        hintEl.style.display = 'block';
      } else {
        chooseBtn.disabled = false;
        chooseBtn.title = '';
        hintEl.style.display = 'none';
      }
      showPickerError('');
    };

    function loadPickerApi(callback) {
      if (pickerApiLoaded && window.google && window.google.picker) {
        callback();
        return;
      }
      if (window.gapi && typeof window.gapi.load === 'function') {
        window.gapi.load('picker', function() {
          pickerApiLoaded = true;
          callback();
        });
        return;
      }
      if (pickerScriptLoading) return;
      pickerScriptLoading = true;

      const script = document.createElement('script');
      script.src = 'https://apis.google.com/js/api.js';
      script.async = true;
      script.defer = true;
      script.onload = function() {
        pickerScriptLoading = false;
        if (window.gapi && typeof window.gapi.load === 'function') {
          window.gapi.load('picker', function() {
            pickerApiLoaded = true;
            callback();
          });
        } else {
          chooseBtn.disabled = false;
          showPickerError('Failed to initialize Google Picker API.');
        }
      };
      script.onerror = function() {
        pickerScriptLoading = false;
        chooseBtn.disabled = false;
        showPickerError('Could not load Google Picker script. Check network access.');
      };
      document.head.appendChild(script);
    }

    function openDriveFolderPicker(config) {
      if (!config || !config.apiKey || !config.oauthToken) {
        chooseBtn.disabled = false;
        showPickerError('Picker configuration is incomplete.');
        return;
      }

      loadPickerApi(function() {
        try {
          const docsView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setMimeTypes('application/vnd.google-apps.folder');

          if (typeof docsView.setEnableDrives === 'function') {
            docsView.setEnableDrives(true);
          }

          const builder = new google.picker.PickerBuilder()
            .addView(docsView)
            .setOAuthToken(config.oauthToken)
            .setDeveloperKey(config.apiKey)
            .setTitle('Select Export Folder')
            .setCallback(function(data) {
              if (data.action === google.picker.Action.PICKED) {
                const doc = data.docs && data.docs[0];
                if (doc && doc.id) {
                  chooseBtn.disabled = true;
                  google.script.run
                    .withSuccessHandler(function(saved) {
                      window.updateExportFolderUI({
                        folderId: saved.folderId,
                        folderName: saved.folderName,
                        source: 'picker',
                        pickerConfigured: currentPickerConfigured
                      });
                    })
                    .withFailureHandler(function(err) {
                      chooseBtn.disabled = false;
                      showPickerError('Failed to save folder: ' + (err.message || String(err)));
                    })
                    .setExportFolder(doc.id, doc.name);
                }
              } else if (data.action === google.picker.Action.CANCEL) {
                chooseBtn.disabled = false;
              }
            });

          if (google.picker.Feature && google.picker.Feature.SUPPORT_DRIVES) {
            builder.enableFeature(google.picker.Feature.SUPPORT_DRIVES);
          }
          if (config.projectNumber) {
            builder.setAppId(config.projectNumber);
          }

          const picker = builder.build();
          picker.setVisible(true);
          chooseBtn.disabled = false;
        } catch (err) {
          chooseBtn.disabled = false;
          showPickerError('Could not open Drive Picker: ' + (err.message || String(err)));
        }
      });
    }

    chooseBtn.addEventListener('click', function() {
      showPickerError('');
      chooseBtn.disabled = true;
      google.script.run
        .withSuccessHandler(openDriveFolderPicker)
        .withFailureHandler(function(err) {
          chooseBtn.disabled = false;
          showPickerError('Failed to load Picker config: ' + (err.message || String(err)));
        })
        .getDrivePickerConfig();
    });

    resetBtn.addEventListener('click', function() {
      showPickerError('');
      resetBtn.disabled = true;
      google.script.run
        .withSuccessHandler(function(status) {
          resetBtn.disabled = false;
          window.updateExportFolderUI(status);
        })
        .withFailureHandler(function(err) {
          resetBtn.disabled = false;
          showPickerError('Failed to reset folder: ' + (err.message || String(err)));
        })
        .clearExportFolder();
    });
  })();
</script>
