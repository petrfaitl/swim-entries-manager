<!doctype html>
<html>
	<head>
		<?!=
		HtmlService.createHtmlOutputFromFile('shared-dialog-styles').getContent();
		?>
	</head>
	<body>
		<div class="header">
			<p>
				Duplicate a template sheet for each team name in a specified
				range.
			</p>
		</div>

		<div class="section">
			<div class="section-label">Template</div>
			<div class="field">
				<label>Template Sheet Name</label>
				<select id="templateName"></select>
			</div>
		</div>

		<div class="section">
			<div class="section-label">Team Names Source</div>
			<div class="field">
				<div class="field-header">
					<label>Sheet with names of Schools/Teams</label>
					<button type="button" id="viewSheetBtn" class="btn-subtle" title="Switch to this sheet in the background">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
							<circle cx="12" cy="12" r="3"></circle>
						</svg>
						<span>View sheet</span>
					</button>
				</div>
				<select id="sheet"></select>
			</div>
			<div class="field">
				<label
					>Range with names
					<span class="hint">e.g., B2:B8</span></label
				>
				<input
					type="text"
					id="range"
					value="B2:B8"
					placeholder="B2:B8"
				/>
			</div>
		</div>

		<button id="createSheetsBtn" type="button">
			<svg
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2.2"
				stroke-linecap="round"
				stroke-linejoin="round"
			>
				<path
					d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
				/>
				<polyline points="14 2 14 8 20 8" />
				<line x1="12" y1="18" x2="12" y2="12" />
				<line x1="9" y1="15" x2="15" y2="15" />
			</svg>
			Create Sheets
		</button>

		<div id="status"></div>

		<script>
			function loadTemplates() {
				google.script.run
					.withSuccessHandler(function (names) {
						const select = document.getElementById("templateName");
						select.innerHTML = "";

						if (!names || names.length === 0) {
							select.innerHTML =
								'<option value="">No template sheets found</option>';
							return;
						}

						names.forEach(function (name) {
							const option = document.createElement("option");
							option.value = name;
							option.textContent = name;
							select.appendChild(option);
						});
					})
					.withFailureHandler(function (err) {
						alert("Error loading templates: " + err.message);
					})
					.getTemplateSheetNames();
			}

			function loadSourceSheets() {
				google.script.run
					.withSuccessHandler(function (options) {
						const select = document.getElementById("sheet");
						select.innerHTML = "";

						let tables = [];
						let defaultTable = "";

						if (options && Array.isArray(options.tables)) {
							tables = options.tables;
							defaultTable =
								options.defaultTable ||
								(tables.length > 0 ? tables[0] : "");
						} else if (Array.isArray(options)) {
							tables = options;
							defaultTable = tables.length > 0 ? tables[0] : "";
						}

						if (tables.length === 0) {
							select.innerHTML =
								'<option value="">No source sheets found</option>';
							return;
						}

						tables.forEach(function (name) {
							const option = document.createElement("option");
							option.value = name;
							option.textContent = name;
							if (name === defaultTable) {
								option.selected = true;
							}
							select.appendChild(option);
						});
					})
					.withFailureHandler(function (err) {
						alert("Error loading source sheets: " + err.message);
					})
					.getSchoolTeamTableOptions();
			}

			function activateSelectedSheet(showFeedback) {
				const select = document.getElementById("sheet");
				const sheetName = select ? select.value.trim() : "";
				if (!sheetName) return;

				const viewBtn = document.getElementById("viewSheetBtn");
				const originalHtml = viewBtn ? viewBtn.innerHTML : "";

				if (showFeedback && viewBtn) {
					viewBtn.style.opacity = "0.7";
				}

				google.script.run
					.withSuccessHandler(function () {
						if (viewBtn) {
							viewBtn.style.opacity = "1";
							if (showFeedback) {
								viewBtn.innerHTML = `
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
										<polyline points="20 6 9 17 4 12"></polyline>
									</svg>
									<span>Active</span>`;
								setTimeout(function () {
									viewBtn.innerHTML = originalHtml;
								}, 1200);
							}
						}
					})
					.withFailureHandler(function (err) {
						if (viewBtn) viewBtn.style.opacity = "1";
						console.error("Error activating sheet: " + err.message);
					})
					.activateSheetByName(sheetName);
			}

			function run() {
				const template = document
					.getElementById("templateName")
					.value.trim();
				const sheetStr = document.getElementById("sheet").value.trim();
				const rangeStr = document.getElementById("range").value.trim();

				if (!template || !rangeStr) {
					alert("Please fill all fields");
					return;
				}

				const btn = document.getElementById("createSheetsBtn");
				btn.disabled = true;
				document.getElementById("status").textContent =
					"Creating sheets…";

				google.script.run
					.withSuccessHandler(function () {
						document.getElementById("status").textContent =
							"Sheets created successfully!";
						document.getElementById("status").className = "success";
						btn.disabled = false;
						setTimeout(function () {
							google.script.host.close();
						}, 1500);
					})
					.withFailureHandler(function (err) {
						document.getElementById("status").textContent =
							"Error: " + err.message;
						document.getElementById("status").className = "error";
						btn.disabled = false;
					})
					.duplicateTemplateForNames(template, sheetStr, rangeStr);
			}

			function bindEvents() {
				const btn = document.getElementById("createSheetsBtn");
				if (!btn) {
					document.getElementById("status").textContent =
						"Error: Button not found.";
					document.getElementById("status").className = "error";
					return;
				}
				btn.addEventListener("click", run);

				const viewSheetBtn = document.getElementById("viewSheetBtn");
				if (viewSheetBtn) {
					viewSheetBtn.addEventListener("click", function () {
						activateSelectedSheet(true);
					});
				}

				document.getElementById("status").textContent = "Ready.";
			}

			if (document.readyState === "loading") {
				document.addEventListener("DOMContentLoaded", function () {
					loadTemplates();
					loadSourceSheets();
					bindEvents();
				});
			} else {
				loadTemplates();
				loadSourceSheets();
				bindEvents();
			}
		</script>
	</body>
</html>
