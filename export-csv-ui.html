<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
<?!= HtmlService.createHtmlOutputFromFile('shared-dialog-styles').getContent(); ?>
  </head>
  <body>

<div class="header">
  <p>Export swimmer entries to CSV format for manual processing or external tools.</p>
</div>

<div class="section">
  <div class="section-label">Export</div>
  <div class="field">
    <label for="sheetSelect">Entries Sheet</label>
    <select id="sheetSelect"></select>
  </div>

  <div class="field">
    <label for="schoolsTable">School/Team Table Name</label>
    <select id="schoolsTable"></select>
  </div>

  <div class="field">
    <label for="fileName">Output File Name <span class="hint">auto-generated if blank</span></label>
    <input type="text" id="fileName" placeholder="Leave blank for auto-generation">
  </div>
</div>

<button id="exportBtn" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
  Export to CSV
</button>

<div id="status"></div>

<div id="downloadLink" class="download-link">
  <a href="#" id="fileUrl" target="_blank">Download File</a>
</div>

<script>
  const exportBtn = document.getElementById('exportBtn');
  const status = document.getElementById('status');
  const downloadLink = document.getElementById('downloadLink');
  const fileUrl = document.getElementById('fileUrl');
  const sheetSelect = document.getElementById('sheetSelect');
  const schoolsTableSelect = document.getElementById('schoolsTable');

  // Initialize export options (filtered entry sheets and School/Team tables)
  google.script.run.withSuccessHandler(options => {
    sheetSelect.innerHTML = '';
    schoolsTableSelect.innerHTML = '';

    // Populate entry sheets
    if (options && options.entrySheets && options.entrySheets.length > 0) {
      options.entrySheets.forEach(sheet => {
        const opt = document.createElement('option');
        opt.value = sheet;
        opt.textContent = sheet;
        sheetSelect.appendChild(opt);
      });
    } else {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '-- No entry sheets found --';
      sheetSelect.appendChild(opt);
    }

    // Populate School/Team tables
    if (options && options.schoolTeamTables && options.schoolTeamTables.length > 0) {
      options.schoolTeamTables.forEach(tableName => {
        const opt = document.createElement('option');
        opt.value = tableName;
        opt.textContent = tableName;
        if (tableName === options.defaultSchoolTeamTable) {
          opt.selected = true;
        }
        schoolsTableSelect.appendChild(opt);
      });
    } else {
      ['Schools', 'Teams'].forEach(tableName => {
        const opt = document.createElement('option');
        opt.value = tableName;
        opt.textContent = tableName;
        if (tableName === 'Schools') opt.selected = true;
        schoolsTableSelect.appendChild(opt);
      });
    }
  }).withFailureHandler(err => {
    status.textContent = "Error loading export options: " + err.message;
    status.className = "error";
  }).getSDIFExportOptions();

  exportBtn.addEventListener('click', () => {
    const sheetName = sheetSelect.value;
    const schoolsTable = schoolsTableSelect.value;
    const fileName = document.getElementById('fileName').value;

    if (!sheetName) {
      status.textContent = "Please select an entries sheet.";
      status.className = "error";
      return;
    }

    exportBtn.disabled = true;
    status.textContent = "Exporting entries to CSV... please wait.";
    status.className = "";
    downloadLink.style.display = "none";

    google.script.run
      .withSuccessHandler(url => {
        status.textContent = "Successfully exported!";
        status.className = "success";
        fileUrl.href = url;
        downloadLink.style.display = "block";
        exportBtn.disabled = false;
      })
      .withFailureHandler(err => {
        status.textContent = "Error: " + (err.message || String(err));
        status.className = "error";
        exportBtn.disabled = false;
      })
      .processSheetToCSV(sheetName, schoolsTable, fileName);
  });
</script>
</body>
</html>
